<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - AIExport</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.x/dist/reset.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"><div class="logo">AIExport</div><ul class="menu">
  <li><a href="/pages/main.html">📊 数据分析</a></li>
  <li><a href="/pages/history.html">📋 历史报告</a></li>
  <li><a href="/pages/templates.html">📁 模版管理</a></li>
  <li><a href="/pages/admin.html" class="active">👤 用户管理</a></li>
  <li style="margin-top:auto;"><a href="#" onclick="logout();return false" style="color:#ff4d4f;">退出登录</a></li>
</ul></nav>

<div class="main-content">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2>用户管理</h2>
    <button id="createBtn" class="btn btn-primary">创建用户</button>
  </div>

  <!-- 创建弹窗 -->
  <div id="createModal" class="ant-modal-mask" style="display:none;">
    <div class="card" style="width:400px;">
      <h3>创建用户</h3>
      <div id="createError" style="color:#ff4d4f;margin-bottom:8px;display:none;"></div>
      <input id="newUsername" placeholder="用户名" class="ant-input" style="margin:8px 0;"><br>
      <input id="newPassword" type="password" placeholder="密码" class="ant-input" style="margin:8px 0;"><br>
      <select id="newRole" class="ant-input" style="margin:8px 0;"><option value="user">普通用户</option><option value="admin">管理员</option></select>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
        <button onclick="document.getElementById('createModal').style.display='none'" class="btn btn-default">取消</button>
        <button id="confirmCreate" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <div id="userList" class="card" style="margin-top:16px;"><p style="color:#888;text-align:center;padding:40px;">加载中...</p></div>
</div>
</div>

<script type="module" src="../js/api.js"></script>
<script type="module">
import { get, post, put, del } from '../js/api.js';
import { checkAuth, logout, isAdmin } from '../js/auth.js';
window.logout = logout;
if (!checkAuth()) { window.location.href = '/pages/login.html'; }
if (!isAdmin()) { document.getElementById('userList').innerHTML = '<p style="color:#ff4d4f;text-align:center;padding:40px;">无权限访问，仅管理员可用</p>'; }

async function render() {
  const container = document.getElementById('userList');
  const res = await get('/admin/users'); const data = await res.json();
  if (!data.users.length) { container.innerHTML='<p style="color:#888;text-align:center;padding:40px;">暂无用户</p>'; return; }
  container.innerHTML = `<table class="data-table"><thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
    <tbody>${data.users.map(u => `<tr><td><strong>${u.username}</strong></td><td>${u.role}</td>
      <td style="color:${u.isActive?'#52c41a':'#ff4d4f'}">${u.isActive?'启用':'禁用'}</td>
      <td>${new Date(u.createdAt).toLocaleDateString()}</td>
      <td><button data-id="${u.id}" data-active="${u.isActive}" class="toggle-btn" style="border:none;background:none;color:#1677ff;cursor:pointer;">${u.isActive?'禁用':'启用'}</button>
      <button data-id="${u.id}" class="del-btn" style="border:none;background:none;color:#ff4d4f;cursor:pointer;">删除</button></td></tr>`).join('')}</tbody></table>`;
  container.querySelectorAll('.toggle-btn').forEach(b => b.onclick = async () => { await put(`/admin/users/${b.dataset.id}/toggle`,{}); render(); });
  container.querySelectorAll('.del-btn').forEach(b => b.onclick = async () => { if(confirm('确定删除？')){ await del(`/admin/users/${b.dataset.id}`); render(); } });
}
document.getElementById('createBtn').onclick = () => document.getElementById('createModal').style.display = 'flex';
document.getElementById('confirmCreate').onclick = async () => {
  const u = document.getElementById('newUsername').value.trim(), p = document.getElementById('newPassword').value.trim(), r = document.getElementById('newRole').value;
  const errEl = document.getElementById('createError');
  if(!u||!p) { errEl.textContent='用户名和密码不能为空'; errEl.style.display='block'; return; }
  try {
    await post('/admin/users',{username:u,password:p,role:r});
    document.getElementById('createModal').style.display='none';
    errEl.style.display='none';
    render();
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display='block';
  }
};
render();
</script>
</body>
</html>
