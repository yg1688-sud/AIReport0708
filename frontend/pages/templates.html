<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模版管理 - AIExport</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.x/dist/reset.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"><div class="logo">AIExport</div><ul class="menu">
  <li><a href="/pages/main.html">📊 数据分析</a></li>
  <li><a href="/pages/history.html">📋 历史报告</a></li>
  <li><a href="/pages/templates.html" class="active">📁 模版管理</a></li>
  <li><a href="/pages/admin.html">👤 用户管理</a></li>
  <li style="margin-top:auto;"><a href="#" onclick="logout();return false" style="color:#ff4d4f;">退出登录</a></li>
</ul></nav>

<div class="main-content">
  <h2>模版管理</h2>
  <div id="templateList" class="card"><p style="color:#888;text-align:center;padding:40px;">加载中...</p></div>
</div>
</div>

<script type="module" src="../js/api.js"></script>
<script type="module">
import { loadTemplateList, deleteTemplate, viewTemplateDetail } from '../js/template.js';
import { checkAuth, logout } from '../js/auth.js';
window.logout = logout;
if (!checkAuth()) { window.location.href = '/pages/login.html'; }

async function render() {
  const container = document.getElementById('templateList');
  try {
    const templates = await loadTemplateList();
    if (!templates.length) { container.innerHTML='<p style="color:#888;text-align:center;padding:40px;">暂无保存的模版</p>'; return; }
    container.innerHTML = `<table class="data-table"><thead><tr><th>模版名称</th><th>策略</th><th>关联列</th><th>保存时间</th><th>操作</th></tr></thead>
      <tbody>${templates.map(t => `<tr><td><strong>${t.name}</strong></td><td>${t.strategy==='merge'?'合并':'分别'}</td>
        <td style="color:#888;">${t.columnNames?.join(', ')||'-'}</td><td>${new Date(t.createdAt).toLocaleDateString()}</td>
        <td><a href="#" data-id="${t.id}" class="view-link">详情</a> <a href="#" data-id="${t.id}" class="del-link" style="color:#ff4d4f;">删除</a></td></tr>`).join('')}</tbody></table>`;
    container.querySelectorAll('.del-link').forEach(a => a.onclick = async e => { e.preventDefault(); if(confirm('确定删除？')){ await deleteTemplate(a.dataset.id); render(); } });
    container.querySelectorAll('.view-link').forEach(a => a.onclick = e => { e.preventDefault(); viewTemplateDetail(a.dataset.id); });
  } catch(e) { container.innerHTML = `<p style="color:#ff4d4f;">加载失败: ${e.message}</p>`; }
}
render();
</script>
</body>
</html>
