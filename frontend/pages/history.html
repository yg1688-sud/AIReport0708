<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史报告 - AIExport</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.x/dist/reset.css">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="layout">
<nav class="sidebar"><div class="logo">AIExport</div><ul class="menu">
  <li><a href="/pages/main.html">📊 数据分析</a></li>
  <li><a href="/pages/history.html" class="active">📋 历史报告</a></li>
  <li><a href="/pages/templates.html">📁 模版管理</a></li>
  <li><a href="/pages/admin.html">👤 用户管理</a></li>
  <li style="margin-top:auto;"><a href="#" onclick="logout();return false" style="color:#ff4d4f;">退出登录</a></li>
</ul></nav>

<div class="main-content">
  <h2>历史报告</h2>
  <div style="display:flex;gap:8px;margin:16px 0;flex-wrap:wrap;">
    <input id="searchInput" type="text" placeholder="搜索文件名..." class="ant-input" style="width:200px;">
    <input id="dateFrom" type="date" class="ant-input" style="width:160px;">
    <input id="dateTo" type="date" class="ant-input" style="width:160px;">
    <button id="batchDownloadBtn" class="btn btn-primary">批量下载</button>
    <button id="batchDeleteBtn" class="btn btn-danger">批量删除</button>
  </div>
  <div id="historyList" class="card"><p style="color:#888;text-align:center;padding:40px;">加载中...</p></div>
  <div id="pagination" style="text-align:center;margin-top:16px;"></div>
</div>
</div>

<!-- 报告弹窗 -->
<div id="reportModal" class="ant-modal-mask" style="display:none;">
  <div class="card" style="width:90%;max-width:1000px;max-height:80vh;overflow-y:auto;position:relative;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 id="modalTitle">报告详情</h2>
      <button onclick="document.getElementById('reportModal').style.display='none'" style="border:none;background:none;font-size:24px;cursor:pointer;">&times;</button>
    </div>
    <div id="modalReportContent"><p style="color:#888;text-align:center;padding:40px;">加载中...</p></div>
    <div id="modalActions" style="text-align:center;margin-top:12px;display:none;">
      <button id="modalDownload" class="btn btn-primary">下载 PDF</button>
      <button onclick="document.getElementById('reportModal').style.display='none'" class="btn btn-default" style="margin-left:8px;">关闭</button>
    </div>
  </div>
</div>

<script type="module" src="../js/api.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module">
import { loadHistory, deleteReport, batchDownload } from '../js/report.js';
import { checkAuth, logout } from '../js/auth.js';
import { formatDate, formatFileSize, debounce } from '../js/utils.js';
window.logout = logout;
if (!checkAuth()) { window.location.href = '/pages/login.html'; }

let selectedIds = new Set(), currentPage = 1;

async function render(page = 1) {
  currentPage = page;
  const keyword = document.getElementById('searchInput')?.value || '';
  const params = { page, pageSize: 20, keyword: keyword || '' };
  const df = document.getElementById('dateFrom')?.value, dt = document.getElementById('dateTo')?.value;
  if (df) params.dateFrom = df;
  if (dt) params.dateTo = dt;

  try {
    const data = await loadHistory(params);
    const container = document.getElementById('historyList');
    if (!data.items?.length) {
      container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">暂无历史报告</p>';
      document.getElementById('pagination').innerHTML = ''; return;
    }
    container.innerHTML = `<table class="data-table"><thead><tr>
      <th><input type="checkbox" id="selectAll"></th><th>文件名</th><th>时间</th><th>模式</th><th>大小</th><th>状态</th><th>过期</th><th>操作</th>
    </tr></thead><tbody>${data.items.map(r => `<tr>
      <td><input type="checkbox" value="${r.id}" class="rcb"></td>
      <td><strong>${r.originalFileName}</strong></td><td>${formatDate(r.createdAt)}</td>
      <td>${r.mode==='template'?'模版':'对话'}</td><td>${r.fileSize?formatFileSize(r.fileSize):'-'}</td>
      <td style="color:${r.reportStatus==='completed'?'#52c41a':'#faad14'}">${r.reportStatus}</td>
      <td>${formatDate(r.expiresAt)}</td>
      <td><a href="#" data-id="${r.id}" class="view-link">查看</a> <a href="#" data-id="${r.id}" class="dl-link">下载</a> <a href="#" data-id="${r.id}" class="del-link" style="color:#ff4d4f;">删除</a></td>
    </tr>`).join('')}</tbody></table>`;

    document.getElementById('selectAll').onchange = e => {
      document.querySelectorAll('.rcb').forEach(cb => { cb.checked = e.target.checked; e.target.checked ? selectedIds.add(cb.value) : selectedIds.delete(cb.value); });
    };
    container.querySelectorAll('.rcb').forEach(cb => cb.onchange = () => { cb.checked ? selectedIds.add(cb.value) : selectedIds.delete(cb.value); });
    container.querySelectorAll('.del-link').forEach(a => a.onclick = async e => { e.preventDefault(); if(confirm('确定删除？')){ await deleteReport(a.dataset.id); render(currentPage); } });
    container.querySelectorAll('.view-link').forEach(a => a.onclick = async e => { e.preventDefault(); viewReportInModal(a.dataset.id); });
    container.querySelectorAll('.dl-link').forEach(a => a.onclick = async e => { e.preventDefault(); const {downloadReport}=await import('../js/report.js'); downloadReport(a.dataset.id); });

    const tp = Math.ceil(data.total / data.pageSize);
    document.getElementById('pagination').innerHTML = tp > 1
      ? `<button ${page<=1?'disabled':''} onclick="window._goPage(${page-1})" class="btn btn-default">&laquo;</button> <span>${page}/${tp}</span> <button ${page>=tp?'disabled':''} onclick="window._goPage(${page+1})" class="btn btn-default">&raquo;</button>` : '';
  } catch(e) { document.getElementById('historyList').innerHTML = `<p style="color:#ff4d4f;">加载失败: ${e.message}</p>`; }
}
window._goPage = render;

async function viewReportInModal(reportId) {
  document.getElementById('reportModal').style.display = 'flex';
  document.getElementById('modalReportContent').innerHTML = '<p style="color:#888;text-align:center;padding:40px;">加载中...</p>';
  document.getElementById('modalActions').style.display = 'none';
  try {
    const token = localStorage.getItem('token');
    const res = await fetch('http://localhost:5000/api/reports/' + reportId, {
      headers: { Authorization: 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('报告不存在');
    const report = await res.json();
    const { renderReport } = await import('../js/report.js');
    // 临时创建 reportContent div 供 renderReport 使用
    const container = document.getElementById('modalReportContent');
    container.innerHTML = '<div id="reportContent"></div>';
    renderReport(report);
    // 显示下载按钮
    document.getElementById('modalActions').style.display = 'block';
    document.getElementById('modalDownload').onclick = async () => {
      const { downloadReport } = await import('../js/report.js');
      downloadReport(reportId);
    };
  } catch(e) {
    document.getElementById('modalReportContent').innerHTML = '<p style="color:#ff4d4f;text-align:center;padding:40px;">加载失败: ' + e.message + '</p>';
  }
}

document.getElementById('batchDownloadBtn').onclick = async () => { if(!selectedIds.size) return alert('请勾选报告'); await batchDownload([...selectedIds]); };
document.getElementById('batchDeleteBtn').onclick = async () => { if(!selectedIds.size) return alert('请勾选报告'); if(!confirm('确定删除选中的 ' + selectedIds.size + ' 份报告吗？此操作不可恢复。')) return; for (const id of selectedIds) { await deleteReport(id); } selectedIds.clear(); render(currentPage); };
document.getElementById('searchInput').addEventListener('input', debounce(() => render(1), 500));
document.getElementById('dateFrom').addEventListener('change', () => render(1));
document.getElementById('dateTo').addEventListener('change', () => render(1));
render();
</script>
</body>
</html>
